<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Guardian Monitor</title>
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/brand.css">
</head>
<body class="popup">
  <main>
    <div class="brand">
      <img class="brand-logo" src="../icons/icon.png" alt="Logo do Guardian Monitor">
      <div>
        <h1>Guardian Monitor</h1>
        <p data-i18n="popupSubtitle">Monitor local de segurança</p>
      </div>
    </div>

    <div id="status" class="status good" data-i18n="activeProtection">Proteção ativa</div>

    <section>
      <h2 data-i18n="recentEvents">Últimos eventos</h2>
      <div id="recent"></div>
    </section>

    <button id="openDashboard" class="primary" data-i18n="openDashboard">Abrir painel completo</button>
    <p class="tiny" data-i18n="popupPrivacy">A extensão não lê o conteúdo dos seus arquivos e não envia seu histórico para servidores.</p>

    <div class="popup-credit">
      <p class="tiny creditline"><span data-i18n="developedBy">Dev pela</span> <strong>Neocodexa</strong></p>
      <a class="github-link" href="https://github.com/neocodexa/guardianmonitor" target="_blank" rel="noopener noreferrer" aria-label="Abrir o Guardian Monitor no GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.24c-3.23.7-3.91-1.37-3.91-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.72 1.27 3.38.97.1-.75.41-1.27.74-1.56-2.58-.29-5.29-1.29-5.29-5.68 0-1.26.45-2.28 1.19-3.08-.12-.29-.52-1.47.11-3.05 0 0 .97-.31 3.16 1.18A10.9 10.9 0 0 1 12 6.12c.98 0 1.95.13 2.87.39 2.2-1.49 3.16-1.18 3.16-1.18.63 1.58.23 2.76.11 3.05.74.8 1.19 1.82 1.19 3.08 0 4.4-2.72 5.38-5.3 5.67.42.36.79 1.07.79 2.16v3.26c0 .31.21.68.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg>
        <span>GitHub</span>
      </a>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
