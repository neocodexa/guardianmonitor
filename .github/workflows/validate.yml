name: Validate extension packages

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source layout
        shell: pwsh
        run: ./scripts/validate-project.ps1

      - name: Build Chromium and Firefox packages
        shell: pwsh
        run: ./scripts/build-packages.ps1

      - name: Upload Chromium package
        uses: actions/upload-artifact@v4
        with:
          name: guardian-monitor-chromium
          path: dist/chromium/*.zip

      - name: Upload Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: guardian-monitor-firefox
          path: dist/firefox/*.zip
